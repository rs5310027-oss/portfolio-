<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bella Bistro</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#fffaf7;color:#333}
    header{height:100vh;background:url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4') center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}
    header h1{font-size:4rem}
    nav{position:fixed;top:0;width:100%;background:rgba(0,0,0,.8);padding:15px;text-align:center}
    nav a{color:#fff;margin:0 20px;text-decoration:none}
    section{padding:80px 10%}
    .menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
    .card{background:#fff;padding:20px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
    form{display:grid;gap:15px;max-width:500px;margin:auto}
    input,button{padding:12px;border-radius:8px;border:1px solid #ccc}
    button{background:#d2691e;color:#fff;border:none;cursor:pointer}
    iframe{width:100%;height:300px;border:none;border-radius:15px}
    footer{text-align:center;padding:20px;background:#222;color:#fff}
  </style>
</head>
<body>
<nav>
<a href="#menu">Menu</a>
<a href="#reservation">Reservation</a>
<a href="#location">Location</a>
</nav>
<header>
<div>
<h1>Bella Bistro</h1>
<p>Cute & Beautiful Fine Dining Experience</p>
</div>
</header>
<section id="menu">
<h2>Our Menu</h2><br>
<div class="menu-grid">
<div class="card"><h3>Pasta</h3><p>$12</p></div>
<div class="card"><h3>Pizza</h3><p>$15</p></div>
<div class="card"><h3>Dessert</h3><p>$8</p></div>
</div>
</section>
<section id="reservation">
<h2>Book a Table</h2><br>
<form>
<input type="text" placeholder="Your Name">
<input type="email" placeholder="Email">
<input type="date">
<input type="time">
<input type="number" placeholder="Guests">
<button>Reserve Now</button>
</form>
</section>
<section id="location">
<h2>Find Us</h2><br>
<iframe src="https://maps.google.com/maps?q=restaurant&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</section>
<footer>
<p>© 2026 Bella Bistro</p>
</footer>
</body>
</html>
