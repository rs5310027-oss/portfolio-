<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 HTML Projects</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a08;
    --surface: #111110;
    --border: #2a2a26;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --accent3: #47d4ff;
    --text: #e8e4d9;
    --muted: #6b6b60;
    --card-bg: #161614;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.5;
  }

  header {
    padding: 80px 60px 60px;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  header::after {
    content: '100';
    position: absolute;
    right: -20px;
    top: -30px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 280px;
    color: transparent;
    -webkit-text-stroke: 1px #2a2a26;
    line-height: 1;
    pointer-events: none;
    user-select: none;
  }

  .tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 12px;
    margin-bottom: 24px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(60px, 10vw, 120px);
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 20px;
  }

  h1 span {
    color: var(--accent);
    display: block;
  }

  .subtitle {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--muted);
    max-width: 500px;
    line-height: 1.6;
  }

  /* Filter bar */
  .filters {
    padding: 24px 60px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    position: sticky;
    top: 0;
    background: rgba(10,10,8,0.95);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .filter-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 8px;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(232, 255, 71, 0.05);
  }

  /* Search */
  .search-wrap {
    margin-left: auto;
    position: relative;
  }

  .search-wrap input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 7px 36px 7px 14px;
    width: 200px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus {
    border-color: var(--accent);
  }

  .search-wrap input::placeholder { color: var(--muted); }

  .search-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 12px;
  }

  /* Counter */
  .counter-bar {
    padding: 16px 60px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
  }

  .count-display {
    font-size: 11px;
    color: var(--muted);
  }

  .count-display strong {
    color: var(--accent);
    font-weight: 500;
  }

  /* Grid */
  .projects-grid {
    padding: 40px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1px;
    background: var(--border);
  }

  .project-card {
    background: var(--card-bg);
    padding: 28px 28px 24px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
    animation: fadeIn 0.4s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .project-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    transform: scaleX(0);
    transition: transform 0.3s;
  }

  .project-card:hover {
    background: #1c1c1a;
  }

  .project-card:hover::before {
    transform: scaleX(1);
  }

  .card-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-num .difficulty {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    padding: 2px 8px;
    border: 1px solid;
  }

  .diff-beginner { color: #4ade80; border-color: #4ade8040; background: #4ade8008; }
  .diff-intermediate { color: #fbbf24; border-color: #fbbf2440; background: #fbbf2408; }
  .diff-advanced { color: var(--accent2); border-color: #ff6b3540; background: #ff6b3508; }

  .card-title {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 300;
    line-height: 1.3;
    color: var(--text);
  }

  .card-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
    flex: 1;
  }

  .card-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .card-tag {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent3);
    background: rgba(71, 212, 255, 0.07);
    padding: 2px 8px;
    border: 1px solid rgba(71, 212, 255, 0.15);
  }

  .card-arrow {
    position: absolute;
    bottom: 24px;
    right: 24px;
    color: var(--muted);
    font-size: 16px;
    transition: all 0.2s;
    opacity: 0;
  }

  .project-card:hover .card-arrow {
    opacity: 1;
    transform: translate(2px, -2px);
    color: var(--accent);
  }

  /* Hidden state */
  .project-card.hidden {
    display: none;
  }

  /* Footer */
  footer {
    padding: 40px 60px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: gap;
  }

  footer p {
    font-size: 11px;
    color: var(--muted);
  }

  footer strong { color: var(--accent); }

  @media (max-width: 768px) {
    header, .filters, .counter-bar, .projects-grid, footer {
      padding-left: 24px;
      padding-right: 24px;
    }
    header { padding-top: 48px; }
    .projects-grid { grid-template-columns: 1fr; }
    .search-wrap { margin-left: 0; width: 100%; }
    .search-wrap input { width: 100%; }
    .filters { flex-direction: column; align-items: flex-start; }
    header::after { font-size: 160px; opacity: 0.5; }
  }
</style>
</head>

<header>
  <div class="tag">HTML · CSS · JavaScript</div>
  <h1>Build <span>100 Projects</span></h1>
  <p class="subtitle">A curated collection of hands-on web projects — from beginner experiments to advanced applications.</p>
</header>

<div class="filters">

  <button class="filter-btn" data-filter="intermediate">Intermediate</button>
  <button class="filter-btn" data-filter="advanced">Advanced</button>
  <button class="filter-btn" data-filter="css">CSS</button>

const diffColors = {
  beginner: 'diff-beginner',
  intermediate: 'diff-intermediate',
  advanced: 'diff-advanced'
};

function renderCards(list) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  list.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'project-card';
    card.style.animationDelay = `${Math.min(i * 0.03, 0.5)}s`;
    card.dataset.diff = p.diff;
    card.dataset.tags = p.tags.join(',');
    card.innerHTML = `
      <div class="card-num">
        <span>${String(p.id).padStart(3,'0')}</span>
        <span class="difficulty ${diffColors[p.diff]}">${p.diff}</span>
      </div>
      <div class="card-title">${p.title}</div>
      <div class="card-desc">${p.desc}</div>
      <div class="card-tags">${p.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}</div>
      <div class="card-arrow">↗</div>
    `;
    grid.appendChild(card);
  });
  updateCount(list.length);
}

function updateCount(n) {
  document.getElementById('visibleCount').textContent = n;
}

let currentFilter = 'all';
let currentSearch = '';

function applyFilters() {
  let list = projects;

  if (currentFilter === 'beginner') list = list.filter(p => p.diff === 'beginner');
  else if (currentFilter === 'intermediate') list = list.filter(p => p.diff === 'intermediate');
  else if (currentFilter === 'advanced') list = list.filter(p => p.diff === 'advanced');
  else if (currentFilter !== 'all') list = list.filter(p => p.tags.includes(currentFilter));

  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    list = list.filter(p =>
      p.title.toLowerCase().includes(q) ||
      p.desc.toLowerCase().includes(q) ||
      p.tags.some(t => t.includes(q))
    );
  }

  renderCards(list);
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilters();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value.trim();
  applyFilters();
});

// Initial render
renderCards(projects);
</script>
